<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do Re Mi 聲控闖關</title>
  <style>
    :root {
      --hud-bg: rgba(15, 18, 25, 0.72);
      --hud-border: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0c12;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    }

    /* Full-bleed AR Stage */
    .ar-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 30% 35%, #242938 0%, #10131b 65%, #090a0f 100%);
    }

    #webcam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    .camera-fallback {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding-left: clamp(72px, 14vw, 180px);
      gap: 10px;
      background: radial-gradient(circle at 28% 45%, rgba(56, 189, 248, 0.14), rgba(10, 12, 18, 0.96) 68%);
      color: #cbd5e1;
    }

    .camera-fallback.hidden {
      display: none;
    }

    .mic-orb {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.25);
      transition: transform 0.06s linear;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: none;
    }

    /* Minimalist Left Volume Bar (Pure Loudness Meter matching reference) */
    .volume-capsule {
      position: fixed;
      left: clamp(24px, 8vw, 96px);
      bottom: 15vh;
      width: 22px;
      height: 46vh;
      z-index: 10;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      border: 1.5px solid rgba(255, 255, 255, 0.42);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      overflow: hidden;
      pointer-events: none;
    }

    .volume-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0%;
      border-radius: 999px;
      background: linear-gradient(to top, #22c55e 0%, #84cc16 58%, #d9f99d 100%);
      box-shadow: 0 0 14px rgba(132, 204, 22, 0.65);
    }

    /* Compact Top Floating Pill HUD */
    .top-hud {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 10px;
      max-width: calc(100vw - 20px);
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--hud-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--hud-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .stage-strip {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .stage-pill {
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.18s ease;
    }

    .stage-pill.done {
      background: rgba(34, 197, 94, 0.22);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.45);
    }

    .stage-pill.active {
      background: rgba(251, 146, 60, 0.28);
      color: #ffedd5;
      border-color: #fb923c;
      transform: scale(1.06);
    }

    .hud-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.16);
    }

    .controls-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .hud-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .hud-btn:active {
      transform: scale(0.95);
    }

    .hud-btn.active {
      background: rgba(34, 197, 94, 0.24);
      border-color: #4ade80;
      color: #dcfce7;
    }

    .hud-btn.primary-action {
      background: rgba(251, 146, 60, 0.26);
      border-color: rgba(251, 146, 60, 0.72);
      color: #ffedd5;
    }

    .hud-btn.calibrating {
      background: rgba(250, 204, 21, 0.26);
      border-color: #facc15;
      color: #fef08a;
    }

    .pitch-chip {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .pitch-chip.match {
      background: rgba(34, 197, 94, 0.25);
      color: #86efac;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(6, 8, 13, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .modal-card {
      width: 100%;
      max-width: 450px;
      padding: 26px;
      border-radius: 22px;
      background: linear-gradient(160deg, #1b202c 0%, #11141c 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      text-align: center;
    }

    .modal-emoji {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .modal-card h1, .modal-card h2 {
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #fff;
    }

    .modal-desc {
      font-size: 13.5px;
      line-height: 1.65;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .modal-rules {
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 18px;
    }

    .modal-cta {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #fb923c, #f97316);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.35);
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .modal-cta:hover {
      filter: brightness(1.06);
    }

    .modal-cta:active {
      transform: scale(0.98);
    }

    .modal-secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .modal-btn-sec {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-btn-sec:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .error-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fecaca;
      font-size: 12.5px;
      line-height: 1.55;
      text-align: left;
      display: none;
    }

    .error-box.visible {
      display: block;
    }

    .error-box code {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.4);
      color: #fde047;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .win-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .win-stat-box {
      padding: 10px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .win-stat-val {
      font-size: 20px;
      font-weight: 800;
      color: #fde047;
    }

    .win-stat-lbl {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    @media (max-width: 720px) {
      .top-hud {
        border-radius: 16px;
        padding: 6px 10px;
      }
      .volume-capsule {
        left: 16px;
        width: 18px;
        height: 40vh;
      }
    }
  </style>
</head>
<body>

  <!-- Compact Top Floating HUD -->
  <header class="top-hud">
    <div class="stage-strip" id="stageStrip"></div>
    <div class="hud-divider"></div>
    <div class="controls-group" id="presetGroup">
      <button class="hud-btn" data-midi="48" title="C3–B3 (131–247 Hz)">低音 C3</button>
      <button class="hud-btn active" data-midi="53" title="F3–E4 (175–330 Hz)">通用 F3</button>
      <button class="hud-btn" data-midi="60" title="C4–B4 (262–494 Hz)">標準 C4</button>
      <button class="hud-btn" id="btnCalibrateDo">🎤 定 Do</button>
      <button class="hud-btn" id="btnSensitivity">🎙️ 靈敏度: 高</button>
      <button class="hud-btn primary-action" id="btnPlayTarget">🔊 目標音</button>
      <button class="hud-btn" id="btnReset">↺ 重來</button>
      <span class="pitch-chip" id="pitchChip">等待聲音</span>
    </div>
  </header>

  <!-- Full-bleed AR Stage: Camera Background + 3D Perspective Overlay -->
  <main class="ar-stage">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="camera-fallback hidden" id="cameraFallback">
      <div class="mic-orb" id="micOrb">🎤</div>
      <div style="font-weight: 700; font-size: 15px;">僅麥克風模式</div>
      <div style="font-size: 12.5px; color: #94a3b8;">未偵測到攝影機，仍可直接聲控遊玩</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Left Vertical Volume Capsule (Pure Loudness Display) -->
    <div class="volume-capsule" aria-label="麥克風音量">
      <div class="volume-fill" id="volumeFill"></div>
    </div>
  </main>

  <!-- Start Modal -->
  <div class="modal-backdrop" id="startModal">
    <div class="modal-card">
      <div class="modal-emoji">🎤🟠🪵</div>
      <h1>Do Re Mi 聲控闖關</h1>
      <p class="modal-desc">
        純前端單檔運行，攝影機與麥克風全在瀏覽器本地處理。
      </p>
      <div class="modal-rules">
        1. 左邊綠黃條顯示你的<strong>聲音大小</strong>。<br />
        2. 你的<strong>聲音高低</strong>直接控制橘色毛球升降高度。<br />
        3. 毛球往前撞到木板會回彈一點，唱準 <strong>Do → Re → Mi → Fa → So → La → Si</strong> 即可穿過洞口過關！
      </div>
      <button class="modal-cta" id="btnStartGame">開啟相機與麥克風開始</button>
      <div class="error-box" id="startErrorBox"></div>
    </div>
  </div>

  <!-- Victory Modal -->
  <div class="modal-backdrop hidden" id="winModal">
    <div class="modal-card">
      <div class="modal-emoji">🏆🎵✨</div>
      <h2>Do → Si 全部通關！</h2>
      <p class="modal-desc">你的音準完美穿越所有木板洞口！</p>
      <div class="win-stats">
        <div class="win-stat-box">
          <div class="win-stat-val" id="winTimeVal">0.0s</div>
          <div class="win-stat-lbl">通關用時</div>
        </div>
        <div class="win-stat-box">
          <div class="win-stat-val" id="winBonksVal">0</div>
          <div class="win-stat-lbl">撞牆次數</div>
        </div>
        <div class="win-stat-box">
          <div class="win-stat-val" id="winKeyVal">F3</div>
          <div class="win-stat-lbl">目前調性 Do</div>
        </div>
      </div>
      <button class="modal-cta" id="btnReplaySame">再玩一次</button>
      <div class="modal-secondary-row">
        <button class="modal-btn-sec" id="btnReplayKeyUp">升一個調再挑戰 (+1)</button>
        <button class="modal-btn-sec" id="btnCloseWin">留在畫面</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // =========================================================================
    // 1. Core Constants & 3D World Coordinate Math
    // =========================================================================
    const STAGES = [
      { name: 'Do', offset: 0 },
      { name: 'Re', offset: 2 },
      { name: 'Mi', offset: 4 },
      { name: 'Fa', offset: 5 },
      { name: 'So', offset: 7 },
      { name: 'La', offset: 9 },
      { name: 'Si', offset: 11 },
    ];

    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    const BALL_RADIUS = 40;
    const HOLE_RADIUS = 64;
    const UNITS_PER_SEMITONE = 33;
    const DO_BASE_Y = 108;
    const BOARD_TOP_Y = 740;
    const ROAD_HALF_W = 170;
    const BOARD_HALF_W = 168;
    const GATE_START_Z = 220;
    const GATE_SPACING_Z = 265;
    const GATE_THICKNESS = 30;
    const FORWARD_SPEED = 215;
    const BOUNCE_SPEED = 265;
    const ACCEL = 620;
    const PITCH_HOLD_MS = 120;

    function clamp(v, min, max) {
      return v < min ? min : (v > max ? max : v);
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function freqToMidi(freq) {
      return 69 + 12 * Math.log2(freq / 440);
    }

    function midiToNoteLabel(midi) {
      const rounded = Math.round(midi);
      const name = NOTE_NAMES[((rounded % 12) + 12) % 12];
      const octave = Math.floor(rounded / 12) - 1;
      return `${name}${octave}`;
    }

    function midiToWorldY(midi, baseMidi) {
      const wy = DO_BASE_Y + (midi - baseMidi) * UNITS_PER_SEMITONE;
      return clamp(wy, BALL_RADIUS, BOARD_TOP_Y - BALL_RADIUS);
    }

    function project3D(wx, wy, wz, camZ, W, H) {
      const S = Math.min(W, H) / 720;
      const F = 340;
      const dz = Math.max(-F + 25, wz - camZ);
      const rawScale = F / (dz + F);
      const vpX = W * 0.96;
      const vpY = H * 0.50;
      const originX = W * 0.42;
      const originY = H * 1.05;
      return {
        x: vpX + (originX + wx * S - vpX) * rawScale,
        y: vpY + (originY - wy * S - vpY) * rawScale,
        scale: rawScale * S,
        rawScale,
      };
    }

    // =========================================================================
    // 2. Time-Domain YIN Pitch Detector (High Sensitivity, Periodicity-Gated)
    // =========================================================================
    function detectPitchYIN(buf, sampleRate, rmsGate = 0.0035) {
      const n = buf.length;
      if (!n || !sampleRate) return { freq: null, rms: 0 };

      let sumSq = 0;
      for (let i = 0; i < n; i++) {
        const s = buf[i];
        sumSq += s * s;
      }
      const rms = Math.sqrt(sumSq / n);
      if (rms < rmsGate) return { freq: null, rms };

      const halfN = Math.floor(n / 2);
      const W = Math.min(1024, halfN);
      const tauMin = Math.max(2, Math.floor(sampleRate / 1000));
      const tauMax = Math.min(n - W - 1, Math.ceil(sampleRate / 75));
      if (tauMax <= tauMin + 1) return { freq: null, rms };

      const cmndf = new Float32Array(tauMax + 1);
      cmndf[0] = 1;
      let runningSum = 0;

      for (let tau = 1; tau <= tauMax; tau++) {
        let diff = 0;
        for (let j = 0; j < W; j++) {
          const d = buf[j] - buf[j + tau];
          diff += d * d;
        }
        runningSum += diff;
        cmndf[tau] = runningSum > 0 ? (diff * tau) / runningSum : 1;
      }

      let tauEstimate = -1;
      for (let tau = tauMin; tau <= tauMax; tau++) {
        if (cmndf[tau] < 0.16) {
          while (tau + 1 <= tauMax && cmndf[tau + 1] < cmndf[tau]) {
            tau++;
          }
          tauEstimate = tau;
          break;
        }
      }

      if (tauEstimate === -1) {
        let minVal = Infinity;
        let minTau = -1;
        for (let tau = tauMin; tau <= tauMax; tau++) {
          if (cmndf[tau] < minVal) {
            minVal = cmndf[tau];
            minTau = tau;
          }
        }
        if (minVal >= 0.24 || minTau === -1) {
          return { freq: null, rms };
        }
        tauEstimate = minTau;
      }

      let betterTau = tauEstimate;
      if (tauEstimate > 1 && tauEstimate < tauMax) {
        const s0 = cmndf[tauEstimate - 1];
        const s1 = cmndf[tauEstimate];
        const s2 = cmndf[tauEstimate + 1];
        const denom = 2 * (2 * s1 - s2 - s0);
        if (Math.abs(denom) > 1e-12) {
          const shift = (s2 - s0) / denom;
          if (Math.abs(shift) < 1) {
            betterTau += shift;
          }
        }
      }

      const freq = sampleRate / betterTau;
      if (!Number.isFinite(freq) || freq < 70 || freq > 1050) {
        return { freq: null, rms };
      }
      return { freq, rms };
    }

    // =========================================================================
    // 3. 3D Game State & Pure Physics Step
    // =========================================================================
    function createGates(baseMidi) {
      return STAGES.map((stage, i) => ({
        index: i,
        name: stage.name,
        targetMidi: baseMidi + stage.offset,
        z: GATE_START_Z + i * GATE_SPACING_Z,
        holeY: DO_BASE_Y + stage.offset * UNITS_PER_SEMITONE,
        holeRadius: HOLE_RADIUS,
        shake: 0,
        passed: false,
      }));
    }

    function recomputeGates(state) {
      for (let i = 0; i < STAGES.length; i++) {
        state.gates[i].targetMidi = state.baseMidi + STAGES[i].offset;
        state.gates[i].holeY = DO_BASE_Y + STAGES[i].offset * UNITS_PER_SEMITONE;
        state.gates[i].holeRadius = HOLE_RADIUS;
      }
    }

    function createGameState(baseMidi = 53) {
      return {
        baseMidi,
        gates: createGates(baseMidi),
        stage: 0,
        bonks: 0,
        elapsed: 0,
        won: false,
        started: false,
        camZ: 0,
        smoothedMidi: null,
        lastFreq: null,
        lastRms: 0,
        volumeLevel: 0,
        particles: [],
        ball: {
          x: 0,
          y: BALL_RADIUS,
          z: 60,
          vz: FORWARD_SPEED * 0.5,
          radius: BALL_RADIUS,
          squash: 0,
          rot: 0,
        },
      };
    }

    function spawnParticles(state, x, y, z, color, count) {
      if (!state.particles) return;
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 70 + Math.random() * 190;
        state.particles.push({
          x,
          y,
          z,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd + 60,
          vz: (Math.random() - 0.5) * 90,
          life: 0.4 + Math.random() * 0.35,
          maxLife: 0.75,
          size: 4 + Math.random() * 5,
          color,
        });
      }
    }

    function stepPhysics(state, rawDt) {
      const dt = Math.min(Math.max(rawDt, 0), 0.05);
      const ball = state.ball;

      ball.squash = Math.max(0, ball.squash - dt * 5.2);
      for (let i = 0; i < state.gates.length; i++) {
        state.gates[i].shake = Math.max(0, state.gates[i].shake - dt * 5.0);
      }
      if (state.particles) {
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.z += p.vz * dt;
          p.vy -= 420 * dt;
          p.life -= dt;
          if (p.life <= 0) state.particles.splice(i, 1);
        }
      }

      if (!state.started || state.won) return;

      state.elapsed += dt;

      // 1. Voice pitch directly controls the orange ball's vertical world height
      if (state.smoothedMidi !== null) {
        const targetY = midiToWorldY(state.smoothedMidi, state.baseMidi);
        ball.y += (targetY - ball.y) * (1 - Math.exp(-15 * dt));
      } else {
        ball.y += (BALL_RADIUS - ball.y) * (1 - Math.exp(-6 * dt));
      }

      // 2. Forward Z motion & active gate collision
      const prevZ = ball.z;
      ball.vz = Math.min(FORWARD_SPEED, ball.vz + ACCEL * dt);
      ball.z += ball.vz * dt;
      ball.rot += (ball.vz * dt) / BALL_RADIUS;

      const g = state.gates[state.stage];
      if (g) {
        const frontZ = g.z - GATE_THICKNESS / 2;
        const backZ = g.z + GATE_THICKNESS / 2;
        const clearance = g.holeRadius - BALL_RADIUS;
        const inHole = Math.abs(ball.y - g.holeY) <= clearance;

        if (prevZ + BALL_RADIUS <= frontZ && ball.z + BALL_RADIUS > frontZ) {
          if (!inHole) {
            ball.z = frontZ - BALL_RADIUS - 0.5;
            ball.vz = -BOUNCE_SPEED;
            state.bonks++;
            g.shake = 1;
            ball.squash = 1;
            spawnParticles(state, ball.x, ball.y, frontZ, '#fb923c', 10);
            spawnParticles(state, ball.x, ball.y, frontZ, '#fde047', 6);
          }
        }

        if (ball.z + BALL_RADIUS > frontZ && ball.z - BALL_RADIUS < backZ) {
          ball.vz = Math.max(ball.vz, FORWARD_SPEED);
          ball.y = clamp(ball.y, g.holeY - clearance, g.holeY + clearance);
        }

        if (ball.z - BALL_RADIUS >= backZ) {
          g.passed = true;
          spawnParticles(state, 0, g.holeY, backZ, '#4ade80', 16);
          spawnParticles(state, 0, g.holeY, backZ, '#fde047', 10);
          state.stage++;
          if (state.stage >= STAGES.length) {
            state.won = true;
          }
        }
      }

      // 3. Smooth 3D camera follows ball along Z
      const desiredCamZ = Math.max(0, ball.z - 150);
      state.camZ += (desiredCamZ - state.camZ) * (1 - Math.exp(-8 * dt));
    }

    // =========================================================================
    // 4. Browser Runtime (Textures, Mic Pre-Amp, AR Camera, 3D Renderer)
    // =========================================================================
    if (typeof window !== 'undefined' && typeof document !== 'undefined') {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const videoEl = document.getElementById('webcam');
      const cameraFallback = document.getElementById('cameraFallback');
      const micOrb = document.getElementById('micOrb');

      const stageStrip = document.getElementById('stageStrip');
      const volumeFill = document.getElementById('volumeFill');
      const pitchChip = document.getElementById('pitchChip');

      const startModal = document.getElementById('startModal');
      const startErrorBox = document.getElementById('startErrorBox');
      const winModal = document.getElementById('winModal');
      const winTimeVal = document.getElementById('winTimeVal');
      const winBonksVal = document.getElementById('winBonksVal');
      const winKeyVal = document.getElementById('winKeyVal');

      const btnStartGame = document.getElementById('btnStartGame');
      const btnCalibrateDo = document.getElementById('btnCalibrateDo');
      const btnSensitivity = document.getElementById('btnSensitivity');
      const btnPlayTarget = document.getElementById('btnPlayTarget');
      const btnReset = document.getElementById('btnReset');
      const btnReplaySame = document.getElementById('btnReplaySame');
      const btnReplayKeyUp = document.getElementById('btnReplayKeyUp');
      const btnCloseWin = document.getElementById('btnCloseWin');
      const presetButtons = Array.from(document.querySelectorAll('#presetGroup [data-midi]'));

      const GAIN_MODES = [
        { label: '高', gain: 3.2 },
        { label: '超高', gain: 6.0 },
        { label: '標準', gain: 1.6 },
      ];
      let gainIdx = 0;

      const state = createGameState(53);
      let viewW = window.innerWidth;
      let viewH = window.innerHeight;
      let usingFallbackBg = false;

      let audioCtx = null;
      let preAmpGain = null;
      let analyser = null;
      let timeDomainBuf = null;
      let mutePitchUntil = 0;
      let lastValidPitchTime = 0;
      const medianBuf = [];
      let lastFrameTime = performance.now();
      let winShown = false;

      let calibrating = false;
      let calSamples = [];
      let calStartAt = 0;

      // -----------------------------------------------------------------------
      // Offscreen Procedural Oak Wood & Fluffy Pom-Pom Textures
      // -----------------------------------------------------------------------
      function createWoodCanvas() {
        const c = document.createElement('canvas');
        c.width = 160;
        c.height = 320;
        const g = c.getContext('2d');

        const base = g.createLinearGradient(0, 0, c.width, 0);
        base.addColorStop(0, '#d8a472');
        base.addColorStop(0.45, '#c78f5c');
        base.addColorStop(0.75, '#ce9662');
        base.addColorStop(1, '#b67d4a');
        g.fillStyle = base;
        g.fillRect(0, 0, c.width, c.height);

        // Vertical wood fibers & wavy cathedral grain
        for (let i = 0; i < 42; i++) {
          const x = (i / 42) * c.width;
          g.strokeStyle = i % 3 === 0 ? 'rgba(115, 62, 22, 0.22)' : 'rgba(255, 226, 188, 0.14)';
          g.lineWidth = 1 + (i % 3) * 0.7;
          g.beginPath();
          g.moveTo(x, 0);
          for (let y = 0; y <= c.height; y += 20) {
            const wave = Math.sin(y * 0.025 + i * 0.65) * 3.5 + Math.cos(y * 0.011 + i) * 2.2;
            g.lineTo(x + wave, y);
          }
          g.stroke();
        }

        // Subtle elliptical grain knots
        g.strokeStyle = 'rgba(110, 58, 18, 0.18)';
        g.lineWidth = 1.6;
        for (let k = 0; k < 3; k++) {
          const kx = 32 + k * 46;
          const ky = 65 + k * 88;
          for (let r = 1; r <= 4; r++) {
            g.beginPath();
            g.ellipse(kx, ky, r * 4.5, r * 22, 0.04, 0, Math.PI * 2);
            g.stroke();
          }
        }
        return c;
      }

      function createPomPomCanvas() {
        const c = document.createElement('canvas');
        const size = 220;
        c.width = size;
        c.height = size;
        const g = c.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;
        const r = 74;

        // Warm core
        const core = g.createRadialGradient(cx - 18, cy - 22, 10, cx, cy, r + 6);
        core.addColorStop(0, '#fdba74');
        core.addColorStop(0.55, '#f97316');
        core.addColorStop(1, '#c2410c');
        g.fillStyle = core;
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.fill();

        // Dense radial multi-layered fluffy fur fibers (no cartoon eyes)
        const colors = ['#ffedd5', '#fdba74', '#fb923c', '#f97316', '#ea580c', '#c2410c'];
        g.lineCap = 'round';

        // Inner body tuft texture
        for (let i = 0; i < 220; i++) {
          const ang = (i * 2.39996) % (Math.PI * 2);
          const dist = Math.sqrt((i + 1) / 220) * (r * 0.88);
          const bx = cx + Math.cos(ang) * dist;
          const by = cy + Math.sin(ang) * dist;
          const outAng = ang + Math.sin(i * 1.7) * 0.45;
          const len = 10 + (i % 7) * 2.1;
          g.strokeStyle = colors[(i + (dist < r * 0.5 ? 0 : 2)) % colors.length];
          g.lineWidth = 2.0;
          g.globalAlpha = 0.72;
          g.beginPath();
          g.moveTo(bx, by);
          g.lineTo(bx + Math.cos(outAng) * len, by + Math.sin(outAng) * len);
          g.stroke();
        }

        // Outer fluffy fringe hairs
        for (let i = 0; i < 280; i++) {
          const ang = (i / 280) * Math.PI * 2 + Math.sin(i * 5.3) * 0.03;
          const innerR = r * (0.70 + (i % 5) * 0.05);
          const outerR = r + 7 + (i % 9) * 2.1;
          const curve = Math.cos(i * 3.1) * 0.14;
          const topLight = Math.sin(ang) < 0 ? 0 : 2;
          g.strokeStyle = colors[(i % 4) + topLight];
          g.lineWidth = 1.6 + (i % 3) * 0.55;
          g.globalAlpha = 0.82;
          g.beginPath();
          g.moveTo(cx + Math.cos(ang) * innerR, cy + Math.sin(ang) * innerR);
          g.lineTo(cx + Math.cos(ang + curve) * outerR, cy + Math.sin(ang + curve) * outerR);
          g.stroke();
        }
        g.globalAlpha = 1;
        return c;
      }

      const woodTex = createWoodCanvas();
      const pomPomTex = createPomPomCanvas();

      // -----------------------------------------------------------------------
      // HUD & State Management
      // -----------------------------------------------------------------------
      function buildStageStrip() {
        stageStrip.innerHTML = '';
        STAGES.forEach((s, i) => {
          const el = document.createElement('span');
          el.className = 'stage-pill';
          el.textContent = s.name;
          el.dataset.idx = String(i);
          stageStrip.appendChild(el);
        });
      }

      function updateHudIndicators() {
        const pills = stageStrip.children;
        for (let i = 0; i < STAGES.length; i++) {
          const done = i < state.stage;
          const active = i === state.stage && !state.won;
          if (pills[i]) {
            pills[i].className = 'stage-pill' + (done ? ' done' : active ? ' active' : '');
          }
        }
      }

      function setBaseMidi(newBaseMidi) {
        state.baseMidi = clamp(Math.round(newBaseMidi), 43, 66);
        recomputeGates(state);
        presetButtons.forEach((btn) => {
          btn.classList.toggle('active', Number(btn.dataset.midi) === state.baseMidi);
        });
      }

      function resetGame(newBaseMidi) {
        if (typeof newBaseMidi === 'number') {
          state.baseMidi = clamp(Math.round(newBaseMidi), 43, 66);
        }
        state.gates = createGates(state.baseMidi);
        state.stage = 0;
        state.bonks = 0;
        state.elapsed = 0;
        state.won = false;
        state.camZ = 0;
        state.particles = [];
        state.ball.x = 0;
        state.ball.y = BALL_RADIUS;
        state.ball.z = 60;
        state.ball.vz = FORWARD_SPEED * 0.5;
        state.ball.squash = 0;
        state.ball.rot = 0;
        winShown = false;
        winModal.classList.add('hidden');
        presetButtons.forEach((btn) => {
          btn.classList.toggle('active', Number(btn.dataset.midi) === state.baseMidi);
        });
        updateHudIndicators();
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        viewW = Math.max(320, window.innerWidth);
        viewH = Math.max(320, window.innerHeight);
        canvas.width = viewW * dpr;
        canvas.height = viewH * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // -----------------------------------------------------------------------
      // WebRTC & Web Audio (Pre-amp Boost + Noise Suppression Off)
      // -----------------------------------------------------------------------
      async function startMedia() {
        startErrorBox.classList.remove('visible');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showMediaError(
            '此瀏覽器環境無法存取麥克風/攝影機 API（常見於直接以 file:// 開啟 Safari）。',
            true
          );
          return;
        }

        const audioConstraints = {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: true,
        };

        let stream = null;
        let hasVideo = false;

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: audioConstraints,
          });
          hasVideo = stream.getVideoTracks().length > 0;
        } catch (_errVideo) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
          } catch (_errStrictAudio) {
            try {
              stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (errFinal) {
              showMediaError(`無法取得麥克風權限：${errFinal.message || errFinal.name}`, true);
              return;
            }
          }
        }

        videoEl.muted = true;
        if (hasVideo) {
          usingFallbackBg = false;
          videoEl.srcObject = stream;
          cameraFallback.classList.add('hidden');
          try {
            await videoEl.play();
          } catch (_e) {}
        } else {
          usingFallbackBg = true;
          videoEl.style.display = 'none';
          cameraFallback.classList.remove('hidden');
        }

        const AudioContextCls = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) {
          audioCtx = new AudioContextCls();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        // Route: mic source -> preAmpGain -> analyser (NEVER connected to destination)
        const source = audioCtx.createMediaStreamSource(stream);
        preAmpGain = audioCtx.createGain();
        preAmpGain.gain.value = GAIN_MODES[gainIdx].gain;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0;

        source.connect(preAmpGain);
        preAmpGain.connect(analyser);
        timeDomainBuf = new Float32Array(analyser.fftSize);

        state.started = true;
        startModal.classList.add('hidden');
        updateHudIndicators();
      }

      function showMediaError(msg, showServerTip) {
        startErrorBox.innerHTML =
          `<strong>啟動失敗：</strong>${msg}` +
          (showServerTip
            ? '<br/>建議：請允許瀏覽器麥克風權限；若使用 Safari 直接開啟本地檔案受限，請在終端機執行：<code>python3 -m http.server 8000</code> 後開啟 <code>http://localhost:8000</code>。'
            : '');
        startErrorBox.classList.add('visible');
      }

      function playTargetTone() {
        if (!audioCtx) {
          const AudioContextCls = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextCls();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const g = state.gates[Math.min(state.stage, STAGES.length - 1)];
        const freq = midiToFreq(g.targetMidi);
        const now = audioCtx.currentTime;
        mutePitchUntil = performance.now() + 380;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      function cycleSensitivity() {
        gainIdx = (gainIdx + 1) % GAIN_MODES.length;
        const mode = GAIN_MODES[gainIdx];
        btnSensitivity.textContent = `🎙️ 靈敏度: ${mode.label}`;
        if (preAmpGain && audioCtx) {
          preAmpGain.gain.setValueAtTime(mode.gain, audioCtx.currentTime);
        }
      }

      function startCalibration() {
        if (!state.started) return;
        calibrating = true;
        calSamples = [];
        calStartAt = performance.now();
        btnCalibrateDo.classList.add('calibrating');
        btnCalibrateDo.textContent = '🎤 唱 Do...';
      }

      function finishCalibration(detectedMidi) {
        calibrating = false;
        btnCalibrateDo.classList.remove('calibrating');
        if (detectedMidi !== null) {
          setBaseMidi(detectedMidi);
          btnCalibrateDo.textContent = `✓ Do=${midiToNoteLabel(state.baseMidi)}`;
          setTimeout(() => {
            if (!calibrating) btnCalibrateDo.textContent = '🎤 定 Do';
          }, 2200);
        } else {
          btnCalibrateDo.textContent = '🎤 定 Do';
        }
      }

      // -----------------------------------------------------------------------
      // Audio Sampling: Loudness -> Left Volume Bar, Pitch -> Ball Height
      // -----------------------------------------------------------------------
      function updateAudio(dt) {
        if (!analyser || !timeDomainBuf) return;

        const nowMs = performance.now();
        if (nowMs < mutePitchUntil) {
          state.smoothedMidi = null;
          return;
        }

        analyser.getFloatTimeDomainData(timeDomainBuf);
        const { freq, rms } = detectPitchYIN(timeDomainBuf, audioCtx.sampleRate, 0.0035);
        state.lastRms = rms;

        // 1. Logarithmic dB loudness meter for Left Volume Bar ([-52 dB, -8 dB])
        const db = 20 * Math.log10(Math.max(rms, 1e-5));
        const targetVol = clamp((db + 52) / 44, 0, 1);
        const volRate = targetVol > state.volumeLevel ? 24 : 8;
        state.volumeLevel += (targetVol - state.volumeLevel) * (1 - Math.exp(-volRate * dt));
        volumeFill.style.height = `${(state.volumeLevel * 100).toFixed(1)}%`;

        if (usingFallbackBg) {
          const orbScale = 1 + state.volumeLevel * 0.32;
          micOrb.style.transform = `scale(${orbScale.toFixed(3)})`;
        }

        // 2. Pitch tracking with 120ms grace hold
        if (freq !== null) {
          lastValidPitchTime = nowMs;
          const rawMidi = freqToMidi(freq);
          medianBuf.push(rawMidi);
          if (medianBuf.length > 3) medianBuf.shift();
          const sorted = medianBuf.slice().sort((a, b) => a - b);
          const medMidi = sorted[Math.floor(sorted.length / 2)];

          if (state.smoothedMidi === null || Math.abs(medMidi - state.smoothedMidi) > 6) {
            state.smoothedMidi = medMidi;
          } else {
            state.smoothedMidi += (medMidi - state.smoothedMidi) * (1 - Math.exp(-16 * dt));
          }
          state.lastFreq = freq;

          if (calibrating) {
            calSamples.push(medMidi);
            if (calSamples.length >= 16 && nowMs - calStartAt >= 450) {
              const midSorted = calSamples.slice().sort((a, b) => a - b);
              finishCalibration(midSorted[Math.floor(midSorted.length / 2)]);
            }
          }
        } else {
          if (nowMs - lastValidPitchTime > PITCH_HOLD_MS) {
            medianBuf.length = 0;
            state.smoothedMidi = null;
            state.lastFreq = null;
          }
          if (calibrating && nowMs - calStartAt > 4000) {
            finishCalibration(null);
          }
        }

        // Update compact pitch status chip in top pill
        if (state.stage < STAGES.length) {
          const g = state.gates[state.stage];
          if (state.smoothedMidi !== null) {
            const diff = state.smoothedMidi - g.targetMidi;
            const tol = (g.holeRadius - BALL_RADIUS) / UNITS_PER_SEMITONE;
            const noteStr = midiToNoteLabel(state.smoothedMidi);
            if (Math.abs(diff) <= tol) {
              pitchChip.textContent = `${noteStr} ✓ 穿過 ${g.name}`;
              pitchChip.className = 'pitch-chip match';
            } else if (diff < 0) {
              pitchChip.textContent = `${noteStr} ↑ 唱高一點 (${g.name})`;
              pitchChip.className = 'pitch-chip';
            } else {
              pitchChip.textContent = `${noteStr} ↓ 唱低一點 (${g.name})`;
              pitchChip.className = 'pitch-chip';
            }
          } else {
            pitchChip.textContent = `目標: ${g.name} (${midiToNoteLabel(g.targetMidi)})`;
            pitchChip.className = 'pitch-chip';
          }
        } else {
          pitchChip.textContent = '全部通關!';
          pitchChip.className = 'pitch-chip match';
        }
      }

      // -----------------------------------------------------------------------
      // 3D Perspective Drawing Helpers
      // -----------------------------------------------------------------------
      function fillQuad(p0, p1, p2, p3, fillStyle, strokeStyle) {
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();
        if (fillStyle) {
          ctx.fillStyle = fillStyle;
          ctx.fill();
        }
        if (strokeStyle) {
          ctx.strokeStyle = strokeStyle;
          ctx.stroke();
        }
      }

      function drawSpotlight(W, H) {
        const sx = W * 0.85;
        const sy = H * 0.08;
        const rad = Math.max(W, H) * 0.24;
        const glow = ctx.createRadialGradient(sx, sy, 4, sx, sy, rad);
        glow.addColorStop(0, 'rgba(255, 255, 255, 0.96)');
        glow.addColorStop(0.16, 'rgba(255, 252, 240, 0.65)');
        glow.addColorStop(0.45, 'rgba(255, 248, 225, 0.18)');
        glow.addColorStop(1, 'rgba(255, 248, 225, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(sx - rad, sy - rad, rad * 2, rad * 2);
      }

      function drawPerspectiveRoad(camZ, W, H) {
        const zNear = Math.max(-240, camZ - 140);
        const zFar = camZ + 2200;

        // 1. Grey asphalt road surface
        const aFL = project3D(-ROAD_HALF_W, 0, zNear, camZ, W, H);
        const aFR = project3D(ROAD_HALF_W, 0, zNear, camZ, W, H);
        const aBR = project3D(ROAD_HALF_W, 0, zFar, camZ, W, H);
        const aBL = project3D(-ROAD_HALF_W, 0, zFar, camZ, W, H);

        const roadGrad = ctx.createLinearGradient(aFL.x, aFL.y, aBR.x, aBR.y);
        roadGrad.addColorStop(0, '#626770');
        roadGrad.addColorStop(1, '#3b3f47');
        fillQuad(aFL, aFR, aBR, aBL, roadGrad);

        // 2. White dashed center lane lines scrolling cleanly in 3D world Z
        const dashPeriod = 140;
        const dashLen = 72;
        const firstDash = Math.floor(zNear / dashPeriod) * dashPeriod;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        for (let z = firstDash; z < zFar; z += dashPeriod) {
          const z0 = Math.max(zNear, z);
          const z1 = Math.min(zFar, z + dashLen);
          if (z1 <= z0) continue;
          const dFL = project3D(-8, 0.5, z0, camZ, W, H);
          const dFR = project3D(8, 0.5, z0, camZ, W, H);
          const dBR = project3D(8, 0.5, z1, camZ, W, H);
          const dBL = project3D(-8, 0.5, z1, camZ, W, H);
          fillQuad(dFL, dFR, dBR, dBL, 'rgba(255, 255, 255, 0.88)');
        }

        // 3. Left raised white tiled sidewalk curb + brown inner bevel
        const curbOuterX = -ROAD_HALF_W - 52;
        const curbInnerX = -ROAD_HALF_W;
        const curbMidX = -ROAD_HALF_W - 26;
        const curbH = 14;

        // Brown curb side wall facing the asphalt
        const wFL = project3D(curbInnerX, 0, zNear, camZ, W, H);
        const wTL = project3D(curbInnerX, curbH, zNear, camZ, W, H);
        const wTR = project3D(curbInnerX, curbH, zFar, camZ, W, H);
        const wBR = project3D(curbInnerX, 0, zFar, camZ, W, H);
        fillQuad(wFL, wTL, wTR, wBR, '#7c5338');

        // White top sidewalk strip
        const cFL = project3D(curbOuterX, curbH, zNear, camZ, W, H);
        const cFR = project3D(curbInnerX, curbH, zNear, camZ, W, H);
        const cBR = project3D(curbInnerX, curbH, zFar, camZ, W, H);
        const cBL = project3D(curbOuterX, curbH, zFar, camZ, W, H);
        const curbGrad = ctx.createLinearGradient(cFL.x, cFL.y, cBR.x, cBR.y);
        curbGrad.addColorStop(0, '#f1f5f9');
        curbGrad.addColorStop(1, '#cbd5e1');
        fillQuad(cFL, cFR, cBR, cBL, curbGrad);

        // Sidewalk tile grid lines (1 longitudinal split + transverse joints)
        ctx.strokeStyle = 'rgba(100, 116, 139, 0.45)';
        ctx.lineWidth = 1.4;
        const mF = project3D(curbMidX, curbH, zNear, camZ, W, H);
        const mB = project3D(curbMidX, curbH, zFar, camZ, W, H);
        ctx.beginPath();
        ctx.moveTo(mF.x, mF.y);
        ctx.lineTo(mB.x, mB.y);
        ctx.stroke();

        const tileStep = 42;
        const firstTile = Math.floor(zNear / tileStep) * tileStep;
        for (let z = firstTile; z < zFar; z += tileStep) {
          if (z < zNear) continue;
          const p0 = project3D(curbOuterX, curbH, z, camZ, W, H);
          const p1 = project3D(curbInnerX, curbH, z, camZ, W, H);
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
      }

      function drawWoodPlank3D(minX, maxX, botY, topY, frontZ, backZ, camZ, W, H, labelText, isDone) {
        const flb = project3D(minX, botY, frontZ, camZ, W, H);
        const frb = project3D(maxX, botY, frontZ, camZ, W, H);
        const flt = project3D(minX, topY, frontZ, camZ, W, H);
        const frt = project3D(maxX, topY, frontZ, camZ, W, H);

        const blb = project3D(minX, botY, backZ, camZ, W, H);
        const brb = project3D(maxX, botY, backZ, camZ, W, H);
        const blt = project3D(minX, topY, backZ, camZ, W, H);
        const brt = project3D(maxX, topY, backZ, camZ, W, H);

        // 1. Right side 3D thickness face (visible when board lies left of vanishing point)
        if (brt.x > frt.x) {
          fillQuad(frb, brb, brt, frt, '#8c5a32', 'rgba(72, 42, 18, 0.45)');
        }
        // Left side 3D thickness face (in case wide aspect ever shifts)
        if (blt.x < flt.x) {
          fillQuad(flb, blb, blt, flt, '#9e683b', 'rgba(72, 42, 18, 0.45)');
        }

        // 2. Top thickness face (for lower plank when below horizon)
        if (blt.y < flt.y) {
          fillQuad(flt, frt, brt, blt, '#e0b282', 'rgba(92, 54, 24, 0.4)');
        }

        // 3. Bottom thickness face (for upper plank when above horizon)
        if (blb.y > flb.y) {
          fillQuad(flb, frb, brb, blb, '#7a4b26', 'rgba(60, 34, 14, 0.5)');
        }

        // 4. Front oak-textured face (screen-aligned rectangle at frontZ)
        const fx = flt.x;
        const fy = flt.y;
        const fw = Math.max(1, frt.x - flt.x);
        const fh = Math.max(1, flb.y - flt.y);

        ctx.save();
        ctx.beginPath();
        ctx.rect(fx, fy, fw, fh);
        ctx.clip();
        ctx.drawImage(woodTex, fx, fy, fw, fh);

        // Subtle highlight edge on front slab
        ctx.strokeStyle = 'rgba(255, 232, 200, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(fx + 0.5, fy + 0.5, fw - 1, fh - 1);

        // Label near the lower center of the upper plank ("Do", "Re", ...)
        if (labelText) {
          const cx = fx + fw * 0.5;
          const cy = fy + fh - Math.min(fh * 0.24, Math.max(24, fw * 0.24));
          const fontSize = clamp(Math.round(fw * 0.34), 16, 62);
          ctx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineJoin = 'round';
          ctx.lineWidth = Math.max(3, fontSize * 0.14);
          ctx.strokeStyle = '#18181b';
          ctx.strokeText(labelText, cx, cy);
          ctx.fillStyle = isDone ? '#86efac' : '#ffffff';
          ctx.fillText(labelText, cx, cy);
        }
        ctx.restore();
      }

      function drawGate3D(g, camZ, W, H, isActive, isDone) {
        const dz = g.z - camZ;
        if (dz < -180 || dz > 2200) return;

        const shakeX = g.shake > 0 ? Math.sin(g.shake * 42) * 14 * g.shake : 0;
        const frontZ = g.z - GATE_THICKNESS / 2;
        const backZ = g.z + GATE_THICKNESS / 2;
        const minX = -BOARD_HALF_W + shakeX;
        const maxX = BOARD_HALF_W + shakeX;
        const lowerTop = Math.max(8, g.holeY - g.holeRadius);
        const upperBot = Math.min(BOARD_TOP_Y - 20, g.holeY + g.holeRadius);

        ctx.save();
        if (isDone) ctx.globalAlpha = 0.6;

        // 1. 3D Wooden Hoop / Cutout Crescent in the open gap (camera shows right through center!)
        const hFront = project3D(shakeX, g.holeY, frontZ, camZ, W, H);
        const hBack = project3D(shakeX, g.holeY, backZ, camZ, W, H);
        const rFront = g.holeRadius * hFront.scale;
        const rBack = g.holeRadius * hBack.scale;

        ctx.save();
        ctx.beginPath();
        ctx.arc(hBack.x, hBack.y, rBack, 0, Math.PI * 2);
        ctx.strokeStyle = isActive ? 'rgba(235, 185, 130, 0.92)' : 'rgba(180, 128, 82, 0.78)';
        ctx.lineWidth = Math.max(3, 8 * hBack.scale);
        ctx.stroke();

        // Crescent shadow highlight on inner rim
        ctx.beginPath();
        ctx.arc(hFront.x, hFront.y, rFront, -Math.PI * 0.45, Math.PI * 0.45);
        ctx.strokeStyle = isActive ? 'rgba(255, 228, 180, 0.95)' : 'rgba(215, 165, 110, 0.7)';
        ctx.lineWidth = Math.max(2, 5 * hFront.scale);
        ctx.stroke();
        ctx.restore();

        // 2. Lower 3D Wooden Block sitting on the road
        drawWoodPlank3D(minX, maxX, 0, lowerTop, frontZ, backZ, camZ, W, H, null, isDone);

        // 3. Upper 3D Wooden Block with bold Do..Si label
        drawWoodPlank3D(minX, maxX, upperBot, BOARD_TOP_Y, frontZ, backZ, camZ, W, H, g.name, isDone);

        ctx.restore();
      }

      function drawFluffyBall3D(state, W, H) {
        const ball = state.ball;
        const pCenter = project3D(ball.x, ball.y, ball.z, state.camZ, W, H);
        const pGround = project3D(ball.x, 0.5, ball.z, state.camZ, W, H);
        const r = ball.radius * pCenter.scale;

        // Ground shadow projected on road surface
        const heightNorm = clamp((ball.y - BALL_RADIUS) / 420, 0, 1);
        ctx.save();
        ctx.translate(pGround.x, pGround.y);
        ctx.scale(1.1 - heightNorm * 0.45, 0.34);
        ctx.fillStyle = `rgba(0, 0, 0, ${0.46 - heightNorm * 0.28})`;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Fluffy orange pom-pom sprite with squash/stretch & subtle roll
        const spriteSize = r * (220 / 74);
        const sq = ball.squash;
        ctx.save();
        ctx.translate(pCenter.x, pCenter.y);
        ctx.scale(1 + sq * 0.16, 1 - sq * 0.24);
        ctx.rotate(ball.rot * 0.35);
        ctx.drawImage(pomPomTex, -spriteSize / 2, -spriteSize / 2, spriteSize, spriteSize);
        ctx.restore();
      }

      function drawParticles3D(state, W, H) {
        for (let i = 0; i < state.particles.length; i++) {
          const p = state.particles[i];
          const sp = project3D(p.x, p.y, p.z, state.camZ, W, H);
          ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, Math.max(1.5, p.size * sp.scale), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function renderScene() {
        ctx.clearRect(0, 0, viewW, viewH);

        drawSpotlight(viewW, viewH);
        drawPerspectiveRoad(state.camZ, viewW, viewH);

        // Depth-sort gates and ball back-to-front along Z
        let ballDrawn = false;
        for (let i = state.gates.length - 1; i >= 0; i--) {
          const g = state.gates[i];
          if (!ballDrawn && state.ball.z > g.z) {
            drawFluffyBall3D(state, viewW, viewH);
            ballDrawn = true;
          }
          drawGate3D(g, state.camZ, viewW, viewH, i === state.stage && !state.won, i < state.stage);
        }
        if (!ballDrawn) {
          drawFluffyBall3D(state, viewW, viewH);
        }

        drawParticles3D(state, viewW, viewH);
      }

      // -----------------------------------------------------------------------
      // Main Animation Loop & Bindings
      // -----------------------------------------------------------------------
      function frame(now) {
        const dt = (now - lastFrameTime) / 1000;
        lastFrameTime = now;

        const prevStage = state.stage;
        updateAudio(Math.min(dt, 0.05));
        stepPhysics(state, dt);
        renderScene();

        if (state.stage !== prevStage) {
          updateHudIndicators();
        }

        if (state.won && !winShown) {
          winShown = true;
          winTimeVal.textContent = `${state.elapsed.toFixed(1)}s`;
          winBonksVal.textContent = String(state.bonks);
          winKeyVal.textContent = midiToNoteLabel(state.baseMidi);
          winModal.classList.remove('hidden');
        }

        requestAnimationFrame(frame);
      }

      btnStartGame.addEventListener('click', startMedia);
      btnSensitivity.addEventListener('click', cycleSensitivity);
      btnPlayTarget.addEventListener('click', playTargetTone);
      btnCalibrateDo.addEventListener('click', startCalibration);
      btnReset.addEventListener('click', () => resetGame());
      btnReplaySame.addEventListener('click', () => resetGame());
      btnReplayKeyUp.addEventListener('click', () => resetGame(state.baseMidi + 1));
      btnCloseWin.addEventListener('click', () => winModal.classList.add('hidden'));

      presetButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          setBaseMidi(Number(btn.dataset.midi));
        });
      });

      window.addEventListener('resize', resizeCanvas);

      buildStageStrip();
      updateHudIndicators();
      resizeCanvas();
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
